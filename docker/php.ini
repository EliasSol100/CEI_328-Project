; Custom PHP settings για athina-eshop

; Uploads
upload_max_filesize = 20M
post_max_size       = 25M
max_file_uploads    = 10

; Memory & execution
memory_limit        = 256M
max_execution_time  = 60

; Timezone
date.timezone       = Europe/Athens

; Errors — OFF σε production, logs μόνο σε αρχείο
display_errors      = Off
log_errors          = On
error_log           = /var/log/apache2/php_errors.log
