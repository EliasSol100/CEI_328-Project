services:

  app:
    build: .
    container_name: athina_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      DB_HOST:     db
      DB_USER:     ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME:     ${DB_NAME:-athina_eshop}
      DB_PORT:     3306
    volumes:
      - uploads_data:/var/www/html/uploads
      - color_photos:/var/www/html/assets/product_color_photos
      - yarn_colors:/var/www/html/assets/yarn_colors
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: athina_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-}
      MARIADB_DATABASE:      ${DB_NAME:-athina_eshop}
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/athina_eshop.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: athina_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST:     db
      PMA_USER:     root
      PMA_PASSWORD: ${DB_PASSWORD:-}
    depends_on:
      - db

volumes:
  db_data:
  uploads_data:
  color_photos:
  yarn_colors:
