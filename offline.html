<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Athina E-shop</title>
    <meta name="theme-color" content="#6A0DAD">
    <style>
        :root {
            color-scheme: light;
            --ink: #26212a;
            --muted: #6d6574;
            --brand: #6A0DAD;
            --accent: #d83f87;
            --surface: #ffffff;
            --page: #f8f9fa;
            --line: #e7dff0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                linear-gradient(135deg, rgba(106, 13, 173, 0.08), rgba(216, 63, 135, 0.08)),
                var(--page);
            color: var(--ink);
        }

        main {
            width: min(100%, 440px);
            padding: 28px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            text-align: center;
            box-shadow: 0 18px 45px rgba(38, 33, 42, 0.08);
        }

        img {
            width: 88px;
            height: 88px;
            object-fit: contain;
            margin-bottom: 14px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 1.65rem;
            line-height: 1.2;
        }

        p {
            margin: 0 0 22px;
            color: var(--muted);
            line-height: 1.55;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 12px 18px;
            background: var(--brand);
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:focus-visible {
            outline: 3px solid rgba(216, 63, 135, 0.3);
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main>
        <img src="assets/pwa/icon-192.png" alt="Athina E-shop">
        <h1>You're offline</h1>
        <p>Reconnect to continue browsing handmade crochet creations.</p>
        <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
</body>
</html>
